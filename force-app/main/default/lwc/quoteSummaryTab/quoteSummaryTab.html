<template>
    <div class="summary-container">

        <!-- ── Quote Info Grid ───────────────────────────────────────── -->
        <div class="info-grid-card">
            <div class="info-grid">
                <div class="info-cell">
                    <span class="info-label">Opportunity</span>
                    <span class="info-value">{opportunityName}</span>
                </div>
                <div class="info-cell">
                    <span class="info-label">Account</span>
                    <span class="info-value account-link">{accountName}</span>
                </div>
                <div class="info-cell">
                    <span class="info-label">Valid Until</span>
                    <span class="info-value">{formattedExpirationDate}</span>
                </div>
                <div class="info-cell">
                    <span class="info-label">Quote Time Period</span>
                    <span class="info-value">{quoteTimePeriod}</span>
                </div>
                <div class="info-cell">
                    <span class="info-label">Created Date</span>
                    <span class="info-value">{formattedCreatedDate}</span>
                </div>
                <div class="info-cell">
                    <span class="info-label">Created By</span>
                    <span class="info-value">{createdByName}</span>
                </div>
            </div>
        </div>

        <!-- ── Revenue Cards + Approval History ─────────────────────── -->
        <div class="revenue-approval-row">

            <!-- Revenue Cards (3) -->
            <div class="revenue-cards">

                <!-- Labor Revenue Card -->
                <div class="rev-card labor-rev-card">
                    <div class="rev-card-top">
                        <div class="rev-icon-wrap labor-icon">
                            <lightning-icon icon-name="standard:service_resource" size="small" variant="inverse"></lightning-icon>
                        </div>
                        <div class="rev-meta">
                            <span class="rev-type">Labor Revenue</span>
                            <span class="rev-trend">{laborTrend}</span>
                        </div>
                    </div>
                    <p class="rev-amount">{laborRevenueFormatted}</p>
                    <p class="rev-sub">Cost: {laborCostFormatted} • Margin: {laborMarginFormatted}</p>
                    <p class="rev-footer">{laborCount} Resource Roles</p>
                </div>

                <!-- Products Revenue Card -->
                <div class="rev-card product-rev-card">
                    <div class="rev-card-top">
                        <div class="rev-icon-wrap product-icon">
                            <lightning-icon icon-name="standard:product" size="small" variant="inverse"></lightning-icon>
                        </div>
                        <div class="rev-meta">
                            <span class="rev-type">Products Revenue</span>
                            <span class="rev-trend rev-trend-down">{productTrend}</span>
                        </div>
                    </div>
                    <p class="rev-amount">{productRevenueFormatted}</p>
                    <p class="rev-sub">Cost: {productCostFormatted} • Margin: {productMarginFormatted}</p>
                    <p class="rev-footer">{productCount} Products</p>
                </div>

                <!-- Add-ons Revenue Card -->
                <div class="rev-card addon-rev-card">
                    <div class="rev-card-top">
                        <div class="rev-icon-wrap addon-icon">
                            <lightning-icon icon-name="standard:waits" size="small" variant="inverse"></lightning-icon>
                        </div>
                        <div class="rev-meta">
                            <span class="rev-type">Add-ons Revenue</span>
                            <span class="rev-trend">{addonTrend}</span>
                        </div>
                    </div>
                    <p class="rev-amount">{addonRevenueFormatted}</p>
                    <p class="rev-sub">Cost: {addonCostFormatted} • Margin: {addonMarginFormatted}</p>
                    <p class="rev-footer">{addonCount} Add-on items</p>
                </div>
            </div>

            <!-- Approval History Panel -->
            <div class="approval-panel">
                <div class="approval-panel-header">
                    <span class="approval-panel-title">Approval History</span>
                </div>
                <p class="approval-panel-sub">Track the approval process for this quote.</p>

                <template if:true={hasApprovalHistory}>
                    <ul class="approval-timeline">
                        <template for:each={approvalHistory} for:item="hist">
                            <li key={hist.Id} class="approval-entry">
                                <div class="approval-avatar">
                                    <lightning-icon icon-name="standard:user" size="x-small"></lightning-icon>
                                </div>
                                <div class="approval-body">
                                    <p class="approval-who">
                                        <strong>{hist.Action_By__r.Name}</strong>
                                        <span class="approval-action"> {hist.Action__c}</span>
                                    </p>
                                    <template if:true={hist.Comments__c}>
                                        <div class="approval-comment">{hist.Comments__c}</div>
                                    </template>
                                    <p class="approval-time">{hist.relativeTime} • {hist.formattedDate}</p>
                                </div>
                            </li>
                        </template>
                    </ul>
                </template>

                <template if:false={hasApprovalHistory}>
                    <div class="no-approval">
                        <div class="no-approval-icon">📄</div>
                        <p class="no-approval-text">No approval history yet.</p>
                        <p class="no-approval-sub">Submit this quote for approval to see the approval history.</p>
                    </div>
                </template>
            </div>
        </div>

        <!-- ── Item Type Breakdown — Full Width Vertical Bar Chart ─── -->
        <div class="breakdown-card">
            <div class="breakdown-header">
                <div>
                    <p class="breakdown-title">Item Type Breakdown</p>
                    <p class="breakdown-sub">Cost and margin distribution by item type</p>
                </div>
                <div class="breakdown-legend">
                    <span class="bl-item">
                        <span class="bl-swatch bl-cost"></span>Cost
                    </span>
                    <span class="bl-item">
                        <span class="bl-swatch bl-margin"></span>Margin
                    </span>
                    <span class="bl-item">
                        <span class="bl-swatch bl-revenue"></span>Revenue
                    </span>
                </div>
            </div>

            <!-- Grouped vertical bar chart -->
            <div class="vbar-chart">
                <template for:each={itemTypeChartData} for:item="row">
                    <div key={row.type} class="vbar-group">

                        <!-- 3 bars per group -->
                        <div class="vbar-bars">

                            <!-- Revenue bar -->
                            <div class="vbar-col">
                                <div class="vbar-label-top">
                                    <span class="vb-num vb-num-rev">{row.revLabel}</span>
                                    <span class="vbar-pct-top pct-neutral">{row.revPct}%</span>
                                </div>
                                <div class="vbar-track">
                                    <div class="vbar-seg vbar-rev" style={row.revBarStyle}></div>
                                </div>
                                <span class="vbar-bar-lbl lbl-rev">Rev</span>
                            </div>

                            <!-- Cost bar -->
                            <div class="vbar-col">
                                <div class="vbar-label-top">
                                    <span class="vb-num vb-num-cost">{row.costLabel}</span>
                                    <span class="vbar-pct-top pct-neutral">{row.costPct}%</span>
                                </div>
                                <div class="vbar-track">
                                    <div class="vbar-seg vbar-cost" style={row.costBarStyle}></div>
                                </div>
                                <span class="vbar-bar-lbl lbl-cost">Cost</span>
                            </div>

                            <!-- Margin bar -->
                            <div class="vbar-col">
                                <div class="vbar-label-top">
                                    <span class="vb-num vb-num-mgn">{row.marginLabel}</span>
                                    <span class={row.marginPctClass}>{row.marginPct}%</span>
                                </div>
                                <div class="vbar-track">
                                    <div class="vbar-seg vbar-mgn" style={row.marginBarStyle}></div>
                                </div>
                                <span class="vbar-bar-lbl lbl-mgn">Margin</span>
                            </div>
                        </div>

                        <!-- Group label (type name + item count) -->
                        <div class="vbar-group-footer">
                            <span class={row.dotClass}></span>
                            <span class="vbar-type-name">{row.type}</span>
                            <span class="vbar-item-count">({row.itemCount})</span>
                        </div>
                    </div>
                </template>

                <template if:false={hasLineData}>
                    <div class="vbar-empty">
                        <p>No line items yet. Add items to see cost &amp; margin breakdown.</p>
                    </div>
                </template>
            </div>

            <!-- Total summary row -->
            <template if:true={hasLineData}>
                <div class="breakdown-totals">
                    <div class="bt-cell">
                        <span class="bt-label">Total Revenue</span>
                        <span class="bt-value bt-rev">{totalRevenueFormatted}</span>
                    </div>
                    <div class="bt-divider"></div>
                    <div class="bt-cell">
                        <span class="bt-label">Total Cost</span>
                        <span class="bt-value bt-cost">{totalCostLineFormatted}</span>
                    </div>
                    <div class="bt-divider"></div>
                    <div class="bt-cell">
                        <span class="bt-label">Overall Margin</span>
                        <span class="bt-value bt-mgn">{overallMarginFormatted}</span>
                        <span class="bt-pct">({overallMarginPct}%)</span>
                    </div>
                </div>
            </template>
        </div>

        <!-- ── Phase Breakdown Table ─────────────────────────────────── -->
        <div class="phase-table-card">
            <table class="phase-table">
                <thead>
                    <tr>
                        <th>Phase</th>
                        <th>Labor</th>
                        <th>Products</th>
                        <th>Add-ons</th>
                        <th>Total</th>
                        <th>Items</th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={phaseTableData} for:item="row">
                        <tr key={row.phase}>
                            <td class="phase-name">{row.phase}</td>
                            <td class="amount-labor">{row.laborFormatted}</td>
                            <td class="amount-product">{row.productFormatted}</td>
                            <td class="amount-addon">{row.addonFormatted}</td>
                            <td class="amount-total">{row.totalFormatted}</td>
                            <td class="item-count">{row.items}</td>
                        </tr>
                    </template>
                    <template if:false={hasPhaseData}>
                        <tr>
                            <td colspan="6" class="empty-phase">No line items yet.</td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>

    </div>
</template>
