<template>
    <div class="container">
        <!-- Custom Header -->
        <template if:false={isModalMode}>
            <div class="header-container">
                <div class="title-group">
                    <div class="back-button">
                        <lightning-icon icon-name="utility:chevronleft" size="small"></lightning-icon>
                    </div>
                    <div class="title-text">
                        <h1>Add-Ons</h1>
                        <p>Manage additional services and items</p>
                    </div>
                </div>
                
                <div class="action-buttons">
                    <template if:true={canManageCatalog}>
                        <lightning-button label="New" variant="brand" icon-name="utility:add" onclick={openModal} class="pill-button slds-m-right_x-small"></lightning-button>
                    </template>
                    <lightning-button label="Refresh" variant="neutral" icon-name="utility:refresh" onclick={handleRefresh} class="pill-button"></lightning-button>
                </div>
            </div>
        </template>

        <!-- Search and Filter Bar -->
        <div class="search-filter-container">
            <div class="search-wrapper">
                <lightning-input
                    type="search"
                    variant="label-hidden"
                    placeholder="Search add-ons..."
                    value={searchKey}
                    onchange={handleSearchChange}
                ></lightning-input>
            </div>
            
            <div class="filter-group">
                <lightning-button-icon icon-name="utility:filterList" variant="border-filled" class="pill-button"></lightning-button-icon>
                <lightning-badge label={addonCount}></lightning-badge>
            </div>
        </div>

        <p class="info-text">Showing 1-{addonCount} of {addonCount}</p>

        <!-- Add-Ons Table -->
        <div class="card-container">
            <lightning-datatable
                key-field="Id"
                data={addons}
                columns={columns}
                class="custom-table"
                onrowaction={handleRowAction}
                onrowselection={handleRowSelection}
                hide-checkbox-column={hideCheckboxColumn}
            ></lightning-datatable>
        </div>

        <!-- Bulk Deletion UI (Hidden in Modal Mode) -->
        <template if:false={isModalMode}>
            <template if:true={canManageCatalog}>
                <!-- Floating Selection Bar -->
                <template if:true={isSelectionActive}>
                    <div class="selection-bar-container">
                        <div class="selection-bar">
                            <div class="selection-count">
                                <span class="count-pill">{selectedCount} selected</span>
                            </div>
                            <div class="selection-actions">
                                <lightning-button label="Clear" variant="bare" onclick={handleClearSelection} class="clear-btn"></lightning-button>
                                <lightning-button label="Delete" variant="destructive" icon-name="utility:delete" onclick={handleBulkDelete} class="bulk-delete-btn"></lightning-button>
                            </div>
                        </div>
                    </div>
                </template>
            </template>


            <!-- Premium Confirmation Modal -->
            <c-cpq-confirmation-modal
                is-open={isConfirmOpen}
                title={confirmTitle}
                message={confirmMessage}
                onconfirm={executeDelete}
                oncancel={closeConfirm}
            ></c-cpq-confirmation-modal>
        </template>


        <!-- Create Modal -->
        <template if:true={isModalOpen}>
            <section role="dialog" tabindex="-1" aria-labelledby="addon-modal-heading" aria-modal="true" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                            <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small"></lightning-icon>
                        </button>
                        <h2 id="addon-modal-heading" class="slds-text-heading_medium slds-hyphenate">{modalTitle}</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <div class="slds-grid slds-wrap slds-gutters">
                            <div class="slds-col slds-size_1-of-1 slds-p-bottom_small">
                                <lightning-input label="Name" placeholder="Enter add-on name" value={addonFields.Name} data-field="Name" onchange={handleFieldChange} required></lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-p-bottom_small">
                                <lightning-textarea label="Description" placeholder="Enter description" value={addonFields.Description} data-field="Description" onchange={handleFieldChange} max-length="255"></lightning-textarea>
                            </div>
                            <div class="slds-col slds-size_1-of-3 slds-p-bottom_small">
                                <lightning-input type="number" step="0.01" label="Price" value={addonFields.Price} data-field="Price" onchange={handleFieldChange} required></lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-3 slds-p-bottom_small">
                                <lightning-input type="number" step="0.01" label="Cost" value={addonFields.Cost} data-field="Cost" onchange={handleFieldChange}></lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-3 slds-p-bottom_small">
                                <lightning-combobox label="Billing Unit" value={addonFields.BillingUnit} options={billingOptions} data-field="BillingUnit" onchange={handleFieldChange} required></lightning-combobox>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-p-bottom_small">
                                <lightning-input label="Tags" placeholder="Enter tag and press Enter" value={addonFields.Tags} data-field="Tags" onchange={handleFieldChange}></lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-p-bottom_small slds-m-top_small">
                                <div class="slds-form-element">
                                    <label class="slds-checkbox_toggle slds-grid">
                                        <span class="slds-form-element__label slds-m-bottom_none">Active</span>
                                        <input type="checkbox" name="checkbox-toggle-16" value="checkbox-toggle-16" aria-describedby="checkbox-toggle-16" checked={addonFields.IsActive} onchange={handleToggleChange} />
                                        <span id="checkbox-toggle-16" class="slds-checkbox_faux_container" aria-live="assertive">
                                            <span class="slds-checkbox_faux"></span>
                                            <span class="slds-checkbox_on"></span>
                                            <span class="slds-checkbox_off"></span>
                                        </span>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={closeModal} class="slds-m-right_x-small"></lightning-button>
                        <lightning-button label={modalButtonLabel} variant="brand" onclick={handleSaveAddOn} disabled={isSaveDisabled}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </div>
</template>
