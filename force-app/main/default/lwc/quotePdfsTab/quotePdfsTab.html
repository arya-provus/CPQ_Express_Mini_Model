<template>
    <div class="pdfs-container">

        <h2 class="section-title">PDF Versions</h2>

        <div class="pdfs-table-wrapper">
            <table class="pdfs-table">
                <thead>
                    <tr>
                        <th class="col-num">#</th>
                        <th>Version</th>
                        <th>Notes</th>
                        <th>Total</th>
                        <th>Margin</th>
                        <th>Created</th>
                        <th>Created By</th>
                        <th class="col-actions">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <template if:true={hasPdfs}>
                        <template for:each={enrichedPdfData} for:item="row">
                            <tr key={row.id} class="pdf-row">
                                <td class="col-num">{row.rowNum}</td>
                                <td class="col-version">
                                    <span class="version-badge">{row.versionLabel}</span>
                                    <template if:true={row.isLatest}>
                                        <span class="latest-badge">Latest</span>
                                    </template>
                                </td>
                                <td class="col-notes">{row.notesDisplay}</td>
                                <td class="col-total">{row.totalFormatted}</td>
                                <td class="col-margin">
                                    <span class="margin-amount">{row.marginAmtFormatted}</span>
                                    <span class="margin-pct-badge">{row.marginLabel}</span>
                                </td>
                                <td class="col-created">{row.createdRelative}</td>
                                <td class="col-creator">{row.createdByName}</td>
                                <td class="col-actions">
                                    <div class="action-icons">
                                        <button class="icon-btn view-btn" title="View" data-id={row.Id} onclick={handleView}>
                                            <span>👁</span>
                                        </button>
                                        <button class="icon-btn download-btn" title="Download" data-id={row.Id} onclick={handleDownload}>
                                            <span>⬇</span>
                                        </button>
                                        <button class="icon-btn delete-btn" title="Delete" data-id={row.Id} onclick={handleDelete}>
                                            <span>🗑</span>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </template>
                    </template>
                    <template if:false={hasPdfs}>
                        <tr>
                            <td colspan="8" class="empty-pdfs">
                                <div class="empty-content">
                                    <div class="empty-icon">📄</div>
                                    <p class="empty-text">No PDFs generated yet</p>
                                    <p class="empty-sub">Click "Generate PDF" to create a quote document.</p>
                                </div>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>

        <!-- Custom PDF Preview Modal (No Share Button) -->
        <template if:true={isPreviewOpen}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_large">
                <div class="slds-modal__container" style="max-width: 90vw; width: 90vw; height: 90vh;">
                    <header class="slds-modal__header" style="background-color: #2b354d; color: white;">
                        <lightning-button-icon icon-name="utility:close" alternative-text="Close" variant="bare-inverse" class="slds-modal__close" onclick={closePreview}></lightning-button-icon>
                        <h2 class="slds-text-heading_medium slds-hyphenate">Preview {previewVersion}</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_none" style="height: 100%; position: relative;">
                        <template if:true={isLoadingPdf}>
                            <div class="slds-p-around_xx-large slds-text-align_center">
                                <lightning-spinner alternative-text="Loading PDF..." size="medium"></lightning-spinner>
                                <p class="slds-m-top_medium">Loading PDF viewer...</p>
                            </div>
                        </template>
                        <template if:true={previewUrl}>
                            <iframe src={previewUrl} width="100%" height="100%" style="border: none;"></iframe>
                        </template>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </div>
</template>
