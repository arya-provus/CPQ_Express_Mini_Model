<template>
    <lightning-card>
        <div class="slds-p-around_medium">

            <!-- ── Quote Header ─────────────────────────────────────── -->
            <div class="quote-header slds-m-bottom_medium">
                <div class="slds-grid slds-wrap slds-grid_vertical-align-center">
                    <div class="slds-col slds-size_8-of-12">
                        <div class="slds-grid slds-grid_vertical-align-center">
                            <template if:true={isLocked}>
                                <lightning-icon
                                    icon-name="utility:lock"
                                    size="x-small"
                                    title="This quote is locked"
                                    class="slds-m-right_x-small lock-icon">
                                </lightning-icon>
                            </template>
                            <div>
                                <h1 class="slds-text-heading_medium slds-m-bottom_xx-small">{quoteName}</h1>
                                <p class="slds-text-body_small slds-text-color_weak">
                                    <template if:true={quoteNumber}>#{quoteNumber}</template>
                                    <template if:true={accountName}> &bull; {accountName}</template>
                                </p>
                            </div>
                        </div>
                    </div>
                    <div class="slds-col slds-size_4-of-12 slds-text-align_right">
                        <span class={statusBadgeClass}>{quoteStatus}</span>
                    </div>
                </div>
            </div>

            <!-- ── Action Buttons ───────────────────────────────────── -->
            <div class="slds-m-bottom_medium slds-grid slds-grid_align-end slds-grid_vertical-align-center">

                <!-- Draft: Add Items + Submit -->
                <template if:false={isLocked}>
                    <lightning-button
                        label="Add Line Items"
                        icon-name="utility:add"
                        variant="neutral"
                        onclick={handleAddLineItems}
                        class="slds-m-right_x-small">
                    </lightning-button>
                </template>

                <lightning-button
                    label="Generate PDF"
                    icon-name="utility:pdf_ext"
                    variant="neutral"
                    onclick={handleGeneratePdf}
                    class="slds-m-right_x-small">
                </lightning-button>

                <!-- Draft only: Submit for Approval -->
                <template if:true={canSubmit}>
                    <lightning-button
                        label="Submit for Approval"
                        icon-name="utility:approval"
                        variant="brand"
                        onclick={openSubmitModal}>
                    </lightning-button>
                </template>

                <!-- In Review only: Recall + Approve + Reject -->
                <template if:true={canRecall}>
                    <lightning-button
                        label="Recall"
                        icon-name="utility:undo"
                        variant="neutral"
                        onclick={handleRecall}
                        class="slds-m-right_x-small">
                    </lightning-button>
                </template>
                <template if:true={canApprove}>
                    <lightning-button
                        label="Approve"
                        icon-name="utility:check"
                        variant="success"
                        onclick={openApproveModal}
                        class="slds-m-right_x-small">
                    </lightning-button>
                </template>
                <template if:true={canReject}>
                    <lightning-button
                        label="Reject"
                        icon-name="utility:error"
                        variant="destructive"
                        onclick={openRejectModal}>
                    </lightning-button>
                </template>
            </div>

            <!-- ── Metrics bar ───────────────────────────────────────── -->
            <div class="metrics-bar slds-m-bottom_medium">
                <div class="metric-item">
                    <p class="metric-label">Total Amount</p>
                    <p class="metric-value">{formattedTotal}</p>
                </div>
                <div class="metric-item">
                    <p class="metric-label">Subtotal</p>
                    <p class="metric-value">{formattedSubtotal}</p>
                </div>
                <div class="metric-item">
                    <p class="metric-label">Margin %</p>
                    <p class="metric-value">{formattedMargin}</p>
                </div>
                <div class="metric-item">
                    <p class="metric-label">Discount %</p>
                    <p class="metric-value">{formattedDiscount}</p>
                </div>
            </div>

            <!-- ── Tabs ─────────────────────────────────────────────── -->
            <lightning-tabset variant="scoped">

                <!-- Summary Tab -->
                <lightning-tab label="Summary">
                    <div class="slds-p-around_medium summary-grid">
                        <!-- Left: Quote Details -->
                        <div class="summary-left">
                            <div class="detail-section slds-m-bottom_medium">
                                <lightning-layout multiple-rows="true">
                                    <lightning-layout-item size="6" padding="around-small">
                                        <p class="detail-label">Status</p>
                                        <p class="detail-value">{quoteStatus}</p>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="6" padding="around-small">
                                        <p class="detail-label">Account</p>
                                        <p class="detail-value">{accountName}</p>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="6" padding="around-small">
                                        <p class="detail-label">Created Date</p>
                                        <p class="detail-value">{formattedCreatedDate}</p>
                                    </lightning-layout-item>
                                    <lightning-layout-item size="6" padding="around-small">
                                        <p class="detail-label">Expiration Date</p>
                                        <p class="detail-value">{formattedExpirationDate}</p>
                                    </lightning-layout-item>
                                </lightning-layout>
                            </div>
                        </div>

                        <!-- Right: Approval History Panel -->
                        <div class="approval-history-panel">
                            <div class="approval-history-header">
                                <lightning-icon icon-name="utility:approval" size="x-small" class="slds-m-right_xx-small"></lightning-icon>
                                <span class="approval-history-title">Approval History</span>
                            </div>
                            <p class="approval-history-subtitle">Track the approval process for this quote.</p>

                            <template if:true={hasApprovalHistory}>
                                <ul class="approval-timeline">
                                    <template for:each={approvalHistory} for:item="entry">
                                        <li key={entry.Id} class="timeline-entry">
                                            <div class="timeline-avatar">
                                                <lightning-icon icon-name="standard:user" size="x-small"></lightning-icon>
                                            </div>
                                            <div class="timeline-body">
                                                <p class="timeline-who">
                                                    <strong>{entry.Action_By__r.Name}</strong>
                                                    <span class="timeline-action-label"> {entry.Action__c}</span>
                                                </p>
                                                <template if:true={entry.Comments__c}>
                                                    <p class="timeline-comment">{entry.Comments__c}</p>
                                                </template>
                                                <p class="timeline-time">
                                                    {entry.relativeTime} &bull; {entry.formattedDate}
                                                </p>
                                            </div>
                                        </li>
                                    </template>
                                </ul>
                            </template>
                            <template if:false={hasApprovalHistory}>
                                <p class="no-history-text">No approval actions yet.</p>
                            </template>
                        </div>
                    </div>
                </lightning-tab>

                <!-- Line Items Tab -->
                <lightning-tab label={lineItemsTabLabel}>
                    <div class="slds-p-around_medium">

                        <!-- EDITABLE table — only shown when quote is in Draft -->
                        <template if:true={showEditableTable}>
                            <lightning-datatable
                                key-field="Id"
                                data={formattedLineItems}
                                columns={editColumns}
                                hide-checkbox-column
                                onrowaction={handleLineAction}
                                onsave={handleLineSave}
                                draft-values={draftValues}>
                            </lightning-datatable>
                        </template>

                        <!-- READ-ONLY table — shown when quote is In Review / Approved / Rejected -->
                        <template if:true={showReadOnlyTable}>
                            <div class="readonly-notice slds-m-bottom_small">
                                <lightning-icon icon-name="utility:lock" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                                <span>Line items are read-only because this quote is <strong>{quoteStatus}</strong>.</span>
                            </div>
                            <lightning-datatable
                                key-field="Id"
                                data={formattedLineItems}
                                columns={readOnlyColumns}
                                hide-checkbox-column>
                            </lightning-datatable>
                        </template>

                        <template if:false={hasLineItems}>
                            <div class="slds-illustration_small slds-p-around_large slds-text-align_center">
                                <p class="slds-text-color_weak">No line items yet. Click "Add Line Items" to get started.</p>
                            </div>
                        </template>
                    </div>
                </lightning-tab>

                <!-- Timeline Tab -->
                <lightning-tab label="Timeline">
                    <c-quote-timeline-tab quote-id={recordId}></c-quote-timeline-tab>
                </lightning-tab>

                <!-- Generated PDFs Tab -->
                <lightning-tab label="Generated PDFs">
                    <div class="slds-p-around_medium slds-text-align_center">
                        <p class="slds-text-color_weak">Click "Generate PDF" to create a quote document.</p>
                    </div>
                </lightning-tab>
            </lightning-tabset>
        </div>
    </lightning-card>

    <!-- ── Submit / Approve / Reject Modal ──────────────────────────────── -->
    <template if:true={isApprovalModalOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header approval-modal-header">
                    <button
                        class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title="Close"
                        onclick={closeApprovalModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="Close" variant="inverse" size="small"></lightning-icon>
                    </button>
                    <h2 class="slds-text-heading_medium">{modalTitle}</h2>
                    <p class="slds-text-body_small modal-subtitle">{modalSubtitle}</p>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-textarea
                        label="Comments"
                        required
                        value={approvalComments}
                        onchange={handleApprovalCommentChange}
                        placeholder="Enter submission comments...">
                    </lightning-textarea>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={closeApprovalModal} class="slds-m-right_x-small"></lightning-button>
                    <lightning-button
                        label={modalConfirmLabel}
                        variant={modalConfirmVariant}
                        onclick={handleActionConfirm}>
                    </lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- ── Add Line Items Modal ──────────────────────────────────────────── -->
    <template if:true={isLineItemModalOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open slds-modal_large">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button
                        class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title="Close"
                        onclick={closeLineItemModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="Close" variant="inverse" size="small"></lightning-icon>
                    </button>
                    <h2 class="slds-text-heading_medium">Add Line Items</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <c-quote-line-manager record-id={recordId} onlineitemsadded={handleLineItemsAdded}></c-quote-line-manager>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
