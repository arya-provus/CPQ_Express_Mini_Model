<template>
    <template if:true={isOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_large">
            <div class="slds-modal__container" style="max-width: 90vw; width: 90vw;">
                <header class="slds-modal__header" style="background-color: #2b354d; color: white;">
                    <lightning-button-icon icon-name="utility:close"
                                           alternative-text="Close"
                                           variant="bare-inverse"
                                           class="slds-modal__close"
                                           onclick={handleClose}></lightning-button-icon>
                    <h2 class="slds-text-heading_medium slds-hyphenate">Generate Quote PDF</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium" style="position: relative; height: 75vh;">
                    <template if:true={isLoading}>
                        <lightning-spinner alternative-text="Generating" size="medium"></lightning-spinner>
                    </template>
                    
                    <div class="slds-grid slds-gutters" style="height: 100%;">
                        <div class="slds-col slds-size_3-of-4" style="height: 100%;">
                            <iframe src={pdfUrl} width="100%" height="100%" style="border: 1px solid #ccc;"></iframe>
                        </div>
                        <div class="slds-col slds-size_1-of-4">
                            <div class="slds-p-bottom_medium">
                                <lightning-textarea label="Add notes" 
                                                  value={notes} 
                                                  onchange={handleNotesChange}
                                                  placeholder="E.g., Special discount applied..."
                                                  max-length="32000"></lightning-textarea>
                            </div>
                            <div class="slds-m-top_medium action-buttons">
                                <lightning-button variant="brand-outline" label="Download" onclick={handleDownload} class="slds-m-right_small"></lightning-button>
                                <lightning-button variant="brand" label="Save PDF Version" onclick={handleSave}></lightning-button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
