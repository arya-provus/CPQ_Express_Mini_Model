<template>
    <div class="accounts-container">

        <!-- ── Page Header ────────────────────────────────────────────── -->
        <div class="page-header">
            <div class="header-left">
                <h1 class="page-title">Accounts</h1>
                <p class="page-subtitle">Manage your customer accounts and relationships</p>
            </div>
            <div class="header-actions">
                <button class="btn-new" onclick={handleNew}>
                    <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5">
                        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    New
                </button>
                <button class="btn-outline" onclick={handleRefresh}>
                    <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5">
                        <path d="M1 4v6h6M23 20v-6h-6"/>
                        <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10M23 14l-4.64 4.36A9 9 0 0 1 3.51 15"/>
                    </svg>
                    Refresh
                </button>
            </div>
        </div>

        <!-- ── Search + Filter Bar ────────────────────────────────────── -->
        <div class="filter-bar">
            <div class="search-wrap">
                <svg class="search-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#b0adab" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input
                    type="text"
                    class="search-input"
                    placeholder="Search accounts by name, phone, or email..."
                    value={searchTerm}
                    onkeyup={handleSearch}
                />
            </div>
            <div class="filter-group">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
                </svg>
                <select class="filter-select" onchange={handleTypeFilter}>
                    <option value="">All Types</option>
                    <template for:each={typeOptions} for:item="opt">
                        <option key={opt} value={opt}>{opt}</option>
                    </template>
                </select>
                <select class="filter-select" onchange={handleIndustryFilter}>
                    <option value="">All Industries</option>
                    <template for:each={industryOptions} for:item="opt">
                        <option key={opt} value={opt}>{opt}</option>
                    </template>
                </select>
            </div>
        </div>

        <!-- ── Results Count ──────────────────────────────────────────── -->
        <p class="results-count">Showing 1-{accountCount} of {accountCount}</p>

        <!-- ── Account Table ──────────────────────────────────────────── -->
        <div class="table-container">
            <table class="account-table">
                <thead>
                    <tr>
                        <th class="col-check"><input type="checkbox" /></th>
                        <th class="col-num">#</th>
                        <th class="col-name">Name</th>
                        <th class="col-accnum">Account Number</th>
                        <th class="col-type">Type</th>
                        <th class="col-industry">Industry</th>
                        <th class="col-website">Website</th>
                        <th class="col-phone">Phone</th>
                        <th class="col-actions">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <template if:true={hasAccounts}>
                        <template for:each={accounts} for:item="acc">
                            <tr key={acc.Id} class="acc-row">
                                <td class="col-check"><input type="checkbox" /></td>
                                <td class="col-num">{acc.rowNum}</td>
                                <td class="col-name">
                                    <a href="javascript:void(0);" class="acc-name-link" onclick={handleAccountClick} data-id={acc.Id}>{acc.Name}</a>
                                </td>
                                <td class="col-accnum">{acc.AccountNumber}</td>
                                <td class="col-type">
                                    <template if:true={acc.Type}>
                                        <span class="type-badge">{acc.Type}</span>
                                    </template>
                                    <template if:false={acc.Type}>
                                        <span class="empty-cell">—</span>
                                    </template>
                                </td>
                                <td class="col-industry">
                                    <template if:true={acc.Industry}>
                                        <span class="industry-badge">{acc.Industry}</span>
                                    </template>
                                    <template if:false={acc.Industry}>
                                        <span class="empty-cell">—</span>
                                    </template>
                                </td>
                                <td class="col-website">
                                    <template if:true={acc.Website}>
                                        <a href={acc.Website} target="_blank" class="website-link">{acc.Website}</a>
                                    </template>
                                    <template if:false={acc.Website}>
                                        <span class="empty-cell">-</span>
                                    </template>
                                </td>
                                <td class="col-phone">
                                    <template if:true={acc.Phone}>
                                        <span>{acc.Phone}</span>
                                    </template>
                                    <template if:false={acc.Phone}>
                                        <span class="empty-cell">-</span>
                                    </template>
                                </td>
                                <td class="col-actions">
                                    <button class="delete-btn" onclick={handleDelete} data-id={acc.Id} title="Delete">
                                        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                                            <polyline points="3 6 5 6 21 6"/>
                                            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                                            <path d="M10 11v6M14 11v6"/>
                                            <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
                                        </svg>
                                    </button>
                                </td>
                            </tr>
                        </template>
                    </template>
                    <template if:false={hasAccounts}>
                        <tr>
                            <td colspan="9" class="empty-row">
                                <p>No accounts found.</p>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>

        <!-- ── Pagination ─────────────────────────────────────────────── -->
        <div class="pagination-row">
            <button class="page-btn" disabled>← Previous</button>
            <span class="page-info">Page 1 of 1</span>
            <button class="page-btn" disabled>Next →</button>
        </div>

    </div>
</template>
